<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Hezb Clips - Tùy chọn</title>
<style>
  body { font: 14px "Segoe UI", sans-serif; margin: 28px; max-width: 560px; color: #1b1c22; }
  h1 { font-size: 20px; } label { display: block; margin-top: 16px; font-weight: 600; font-size: 12px; color: #5c5f78; }
  input { width: 100%; padding: 8px 10px; margin-top: 4px; box-sizing: border-box; font: 14px Consolas, monospace; }
  button { margin: 16px 8px 0 0; padding: 8px 18px; font: inherit; cursor: pointer; }
  #msg { margin-top: 14px; min-height: 20px; } .ok { color: #2ea043; } .err { color: #e5484d; } p { color: #5c5f78; }
</style></head>
<body>
  <h1>Hezb Clips - Chụp cả trang</h1>
  <p>Dán token từ ứng dụng: <b>Cài đặt &gt; Nâng cao &gt; Chụp cả trang qua trình duyệt</b>. Sau đó bấm biểu tượng tiện ích (hoặc Alt+Shift+H) trên trang cần chụp.</p>
  <label for="token">Token</label><input id="token" autocomplete="off" spellcheck="false">
  <label for="port">Cổng</label><input id="port" type="number" value="47831">
  <button id="save">Lưu</button><button id="test">Thử kết nối</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body></html>
